version: 1
name: diskcompat
description:
  en_US: "Add current drives to DSM disk compatibility data and clear unsupported-drive storage pool warnings."
  ar_SA: "إضافة السائقين الحاليين إلى بيانات التوافقية مع التخزين في DSM وتحذيرات منخفضة الأمان بسبب التخزين."
  de_DE: "Fügen Sie die aktuellen Laufwerke zu den DSM-Disk-Kompatibilitätsdaten hinzu und löschen Sie die Warnungen zur untersützten Speicherpool-Sicherheit."
  es_ES: "adicione los discos actuales a los datos de compatibilidad de disco de DSM y elimine las advertencias de seguridad de los grupos de almacenamiento no admitidos."
  fr_FR: "Ajoutez les lecteurs actuels aux données de compatibilité du disque DSM et supprimez les avertissements de sécurité liés aux groupes de stockage non pris en charge."
  ja_JP: "現在のドライブをDSMディスク互換性データに追加し、サポートされていないドライブのストレージプール警告をクリアします。"
  ko_KR: "추가 디스크를 DSM 디스크 컴파일 애트리뷰트에 추가하고 지원되지 않는 저장 풀 보안 경고를 제거합니다."
  ru_RU: "Добавьте текущие диски в данные совместимости дисков DSM и очистите предупреждения о безопасности групп хранения, не поддерживаемых."
  th_TH: "เพิ่มไดรฟ์ปัจจุบันลงในข้อมูลการ兼容 magnetic storage pool และลบการแจ้งเตือนความปลอดภัยของกลุ่ม magnetic storage pool ที่ไม่รองรับ"
  tr_TR: "Etkinli disklerini DSM disk compatibility data'ye ekle ve desteklenen disklerin depolama pool'undaki uyariyi sil."
  uk_UA: "Додайте поточні диски до даних сумісності дисків DSM та очистіть попередження про безпеку групи зберігання, не підтримуваних."
  vi_VN: "Thêm ổ đĩa hiện tại vào dữ liệu tương thích magnetic storage pool và xóa các cảnh báo về bảo mật của magnetic storage pool không được hỗ trợ."
  zh_CN: "将当前硬盘加入 DSM 磁盘兼容性数据，并清理不支持硬盘导致的存储池风险提示。"
  zh_HK: "將當前硬碟加入 DSM 磁碟兼容性數據，並清理不支援硬碟導致的儲存池風險提示。"
  zh_TW: "將當前硬盤加入 DSM 磁盤兼容性數據，並清理不支持硬盤導致的存儲池風險提示。"
system: false
params: false
all:
  install-script: "install.sh"
  copy: "all"
