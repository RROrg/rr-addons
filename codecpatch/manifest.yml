name: codecpatch
description: # https://github.com/wirgen/synocodectool-patch
  en_US: "This patch enables transcoding on Synologys DiskStation Manager 6+ without a valid serial number, From wirgen."
  es_ES: "Este parche permite la transcodificación en DiskStation Manager 6+ de Synology sin un número de serie válido, de wirgen."
  de_DE: "Dieser Patch ermöglicht das Transcodieren auf Synologys DiskStation Manager 6+ ohne gültige Seriennummer, von wirgen."
  fr_FR: "Ce patch permet le transcodage sur DiskStation Manager 6+ de Synology sans numéro de série valide, de wirgen."
  ko_KR: "이 패치는 유효한 일련 번호없이 Synologys DiskStation Manager 6+에서 트랜스 코딩을 활성화합니다. wirgen"
  ru_RU: "Этот патч позволяет транскодировать на Synologys DiskStation Manager 6+ без действительного серийного номера, от wirgen."
  uk_UA: "Цей патч дозволяє транскодувати на Synologys DiskStation Manager 6+ без дійсного серійного номера, від wirgen."
  vi_VN: "Bản vá này cho phép chuyển mã trên Synologys DiskStation Manager 6+ mà không cần số sê-ri hợp lệ, từ wirgen."
  zh_CN: "此补丁可在没有有效序列号的情况下在 Synologys DiskStation Manager 6+ 上启用转码，来自 wirgen."
  zh_HK: "此補丁可在沒有有效序列號的情況下在 Synologys DiskStation Manager 6+ 上啟用轉碼，來自 wirgen."
  zh_TW: "此補丁可在沒有有效序列號的情況下在 Synologys DiskStation Manager 6+ 上啟用轉碼，來自 wirgen."
